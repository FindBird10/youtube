name: Shorts üret ve yükle

on:
  push:
    branches: [main]
    paths: ["episodes/*.json"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Tek bir bölüm (ör. _ornek). Boş bırakılırsa bekleyen tüm bölümler."
        required: false
        default: ""
      upload:
        description: "YouTube'a yüklensin mi?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg ve yazı tipleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libssl3 ca-certificates
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2

      - name: Python paketleri
        run: pip install -r requirements.txt

      - name: Videoları üret ve yükle
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || 'northeurope' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_DEFAULT_PRIVACY: ${{ vars.YT_DEFAULT_PRIVACY || 'private' }}
          MAX_PER_RUN: ${{ vars.MAX_PER_RUN || '3' }}
          IN_EPISODE: ${{ github.event.inputs.episode }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
        run: |
          ARGS=()
          if [ -n "$IN_EPISODE" ]; then ARGS+=(--episode "$IN_EPISODE"); fi
          if [ "$IN_UPLOAD" = "false" ]; then ARGS+=(--no-upload); fi
          python pipeline/run.py "${ARGS[@]}"

      - name: Videoları önizleme için sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: build/*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Yayın kaydını güncelle
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "shorts-bot"
            git config user.email "shorts-bot@users.noreply.github.com"
            git add state/
            git commit -m "Yayın kaydı güncellendi [skip ci]"
            git pull --rebase origin main
            git push
          fi
