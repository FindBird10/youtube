name: Kanal kontrolü (herkese açık videolar)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Token'ların kanallarını kontrol et
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_GAMING: ${{ secrets.YT_REFRESH_TOKEN_GAMING }}
          YT_REFRESH_TOKEN_GLOBAL: ${{ secrets.YT_REFRESH_TOKEN_GLOBAL }}
          YT_REFRESH_TOKEN_NEWS: ${{ secrets.YT_REFRESH_TOKEN_NEWS }}
        run: |
          pip install -q google-api-python-client google-auth requests
          mkdir -p /tmp/k
          python tools/check_tokens.py | tee /tmp/k/tokens.txt
      - name: Kanalların RSS listesini al ve logs-kanal dalına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/k && cd /tmp/k
          for c in gaming:UC-Ady9DQ8uTMpZfV_GeDKIA global:UCp2rjdN1M1z0GMJ2Gshzdfw; do
            n=${c%%:*}; id=${c#*:}
            curl -fsSL "https://www.youtube.com/feeds/videos.xml?channel_id=$id" -o "$n.xml" || echo "alınamadı" > "$n.xml"
            python3 - "$n.xml" > "$n.txt" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
          try:
              root = ET.parse(sys.argv[1]).getroot()
              for e in root.findall("a:entry", ns):
                  print(e.findtext("yt:videoId", "", ns), e.findtext("a:published", "", ns), e.findtext("a:title", "", ns))
          except Exception as ex:
              print("hata:", ex)
          PY
          done
          git init -q -b logs-kanal && git add . \
            && git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "Kanal kontrolü [skip ci]" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" logs-kanal
